[project]
name = "esrum-shared"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Mikkel Schubert", email = "2411627+MikkelSchubert@users.noreply.github.com" }]
dependencies = []

[project.scripts]
esrum-shared = "esrum_shared:main"

[dependency-groups]
dev = [
  "nox>=2026.8.17",
  "ruff>=0.16.8",
  "zuban>=0.10.0",
]
config = [
  "koda-validate~=4.2.0",
]
logging = [
  "colorlog>=6.12.0",
]
slack = [
  "requests~=2.33.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.zuban]
check_untyped_defs = true
disallow_any_explicit = true
disallow_untyped_defs = true
mode = "default"
python_executable = ".venv/bin/python"
strict = true
warn_unreachable = true
