[project]
name = "monitor-stats"
dynamic = ["version"]

requires-python = ">=3.12"
dependencies = [
  "colorlog>=6.12.0",
  "koda-validate==4.1.1",
  "psutil==7.2.1",
  "requests~=2.33.0",
  "tomli==2.0.1",
]

[project.scripts]
monitor-stats = "monitor_stats._main:main"

[dependency-groups]
dev = [
  "types-psutil==7.2.1.20260116",
  "types-requests==2.33.0.20260712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/monitor_stats/__init__.py"

[tool.zuban]
check_untyped_defs = true
disallow_any_explicit = true
disallow_untyped_defs = true
mode = "default"
python_executable = ".venv/bin/python"
strict = true
warn_unreachable = true
