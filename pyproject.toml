[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = [
  "ANN",  # flake8-annotations
  "ARG",  # flake8-unused-arguments
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "E",  # pycodestyle
  "F",  # pyflakes
  "FA",  # flake8-future-annotations
  "FBT",  # flake8-boolean-trap (TODO)
  "FLY",  # flynt
  "I",  # isort
  "INP",  # flake8-no-pep420
  "LOG",  # flake8-logging
  "G",  # flake8-logging-format
  "PTH",  # flake8-use-pathlib (TODO)
  "S",  # flake8-bandit
  "UP",  # pyupgrade
  "PT",  # flake8-pytest-style
  "W",  # warning, pycodestyle
  "N",  # pep8-naming (N)
  "SIM",  # flake8-simplify
  "PIE",  # flake8-pie
  "PLE",  # pylint errors
  "PYI",  # flake8-pyi
  "RUF",  # ruff specific rules
  "FURB",  # refurb
  "TID",  # flake8-tidy-imports"
  "PL",  # pylint
]

ignore = [
  "B904",  # flake8-bugbear -- raise-without-from-inside-except
  "S311",  # flake8-bandit -- suspicious-non-cryptographic-random-usage
  "S603",  # flake8-bandit -- subprocess-without-shell-equals-true
  "S607",  # flake8-bandit -- start-process-with-partial-path
  "UP032",  # pyupgrade -- f-string
  "PLR09",  # pylint -- too-many-*
  "PLR2004",  # pylint -- magic-value-comparison
  "PLW2901",  # pylint -- redefined-loop-name
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
  "S101",  # assert -- Use of assert detected
  "S108",  # hardcoded-temp-file -- Probable insecure usage of temporary file or dir
]

"noxfile.py" = [
  "INP001",  # implicit-namespace-package
]
