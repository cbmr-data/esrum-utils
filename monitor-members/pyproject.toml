[project]
name = "monitor-members"
dynamic = ["version"]

requires-python = ">=3.12"
dependencies = [
  "esrum-shared[logging]",
  "koda-validate~=4.2.0",
  "pyodbc>=5.3.0",
  "requests~=2.33.0",
  "sqlalchemy~=2.0.51",
  "tomli~=2.0.2",
  "typed-argparse~=0.3.1",
  "zuban>=0.9.3",
]

[project.scripts]
monitor-members = "monitor_members.__main__:main_w"

[dependency-groups]
dev = [
  "nox>=2024.10.9",
  "ruff>=0.16.5",
  "types-requests>=2.33.0.20260712",
  "zuban>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/monitor_members/__init__.py"

[tool.mypy]
mypy_path = "typings"

[tool.ruff]
target-version = "py312"

[tool.uv.sources]
esrum-shared = { path = "../esrum-shared" }

[tool.zuban]
check_untyped_defs = true
disallow_any_explicit = true
disallow_untyped_defs = true
mode = "default"
python_executable = ".venv/bin/python"
strict = true
warn_unreachable = true
